<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<meta name="color-scheme" content="dark">
<meta name="description" content="Tarjeta de presentación de Edgardo Romero (EAMR): Estratega de Activos Musicales Registrables. Catálogo, licencias y pagos.">
<title>EAMR — Edgardo Romero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#09090b;
  --ink2:#0f0f10;
  --panel:rgba(255,255,255,.03);
  --line:rgba(201,162,39,.16);

  --gold:#C9A227;
  --gold-soft:rgba(201,162,39,.16);
  --gold-text:#E9D9A0;

  --verde:#2E8B63;
  --verde-soft:rgba(46,139,99,.16);

  --rosa:#B23A70;
  --rosa-soft:rgba(178,58,112,.16);

  --naranja:#C97A2E;
  --naranja-soft:rgba(201,122,46,.16);

  --cian:#2A94A6;
  --cian-soft:rgba(42,148,166,.16);

  --cream:#EAE2C8;
  --muted:#8b8478;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none}
body{
  background:
    radial-gradient(ellipse 90% 55% at 50% 0%, rgba(201,162,39,.07) 0%, transparent 60%),
    radial-gradient(ellipse 70% 40% at 50% 100%, rgba(42,148,166,.05) 0%, transparent 65%),
    var(--ink);
  color:var(--cream);
  font-family:'Rajdhani',sans-serif;
  overflow:hidden;
  height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:1;
  background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.035) 3px,rgba(0,0,0,.035) 4px);
}

.card{
  position:relative;
  width:min(420px,94vw);
  height:min(100dvh - 16px, 780px);
  padding:clamp(10px,3dvh,20px) clamp(14px,4vw,22px);
  display:flex;
  flex-direction:column;
  z-index:2;
  gap:clamp(6px,1.4dvh,12px);
}

/* ═══ SEAL / MEDALLION — signature element (escudo EAMR real) ═══ */
.seal-row{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;}
.seal-wrap{
  position:relative;
  height:clamp(84px,21dvh,128px);
  aspect-ratio:560/792;
}
.seal-glow{
  position:absolute;left:50%;top:44%;
  width:150%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle,rgba(201,162,39,.32) 0%,transparent 68%);
  filter:blur(3px);
  animation:pulse 5s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:.65;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}}
.seal-orbit{
  position:absolute;left:50%;top:44%;
  width:132%;aspect-ratio:1;
  transform:translate(-50%,-50%);
  border-radius:50%;
  border:1px dashed rgba(201,162,39,.38);
  animation:spin 20s linear infinite;
}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.seal-wrap img{
  position:relative;z-index:1;
  width:100%;height:100%;object-fit:contain;
  filter:drop-shadow(0 0 8px rgba(201,162,39,.4)) drop-shadow(0 2px 10px rgba(0,0,0,.5));
}
.seal-link{
  display:flex;flex-direction:column;align-items:center;
  text-decoration:none;color:inherit;
  transition:transform .15s ease;
}
.seal-link:active{transform:scale(.96)}
.seal-hint{
  margin-top:clamp(2px,.6dvh,5px);
  font-size:clamp(.48rem,1.2dvh,.56rem);
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);opacity:.8;
  transition:color .15s ease;
}
.seal-link:active .seal-hint{color:var(--gold-text)}

/* ═══ IDENTIDAD ═══ */
.id-row{text-align:center;flex:0 0 auto;}
.id-row h1{
  font-family:'Cinzel',serif;font-weight:600;
  font-size:clamp(1rem,3.4dvh,1.3rem);
  color:var(--cream);letter-spacing:.02em;
}
.id-row p{
  font-size:clamp(.68rem,2dvh,.82rem);
  color:var(--muted);margin-top:2px;letter-spacing:.02em;
}

/* ═══ ONDA — divisor sonoro animado ═══ */
.wave-row{flex:0 0 auto;width:100%;height:clamp(20px,4.4dvh,34px);}
#wave-canvas{width:100%;height:100%;display:block}

/* ═══ CONTACTO — fila de íconos ═══ */
.contact-row{display:flex;justify-content:center;gap:clamp(8px,2.2vw,14px);flex:0 0 auto;}
.contact-btn{
  width:clamp(38px,9.5dvh,46px);height:clamp(38px,9.5dvh,46px);
  border-radius:50%;
  border:1px solid var(--line);
  background:var(--panel);
  display:flex;align-items:center;justify-content:center;
  color:var(--gold-text);text-decoration:none;
  transition:transform .15s ease, background .15s ease, border-color .15s ease;
}
.contact-btn svg{width:46%;height:46%}
.contact-btn:active{transform:scale(.88);background:var(--gold-soft);border-color:var(--gold)}

/* ═══ DIVISOR ═══ */
.divider{display:flex;align-items:center;gap:8px;flex:0 0 auto;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.divider span{
  font-size:clamp(.55rem,1.5dvh,.64rem);letter-spacing:.24em;text-transform:uppercase;
  color:var(--muted);white-space:nowrap;
}

/* ═══ ATAJOS — grid de accesos al catálogo ═══ */
.shortcuts{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:clamp(6px,1.4dvh,9px);
  flex:1 1 auto;min-height:0;
}
.chip{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  border-radius:12px;border:1px solid var(--c-line);
  background:var(--c-soft);
  color:var(--c-text);text-decoration:none;
  padding:clamp(4px,1dvh,8px) 2px;
  transition:transform .12s ease, background .12s ease;
}
.chip:active{transform:scale(.93)}
.chip .ic{font-size:clamp(1rem,3.2dvh,1.25rem);line-height:1}
.chip .lb{font-size:clamp(.52rem,1.4dvh,.6rem);letter-spacing:.05em;text-transform:uppercase;font-weight:600}

.shortcuts .chip:last-child:nth-child(3n+1){grid-column:1/-1}
.chip.gold{--c-line:var(--line);--c-soft:var(--gold-soft);--c-text:var(--gold-text)}
.chip.verde{--c-line:rgba(46,139,99,.35);--c-soft:var(--verde-soft);--c-text:#8fd1b4}
.chip.rosa{--c-line:rgba(178,58,112,.35);--c-soft:var(--rosa-soft);--c-text:#e0a0bf}
.chip.naranja{--c-line:rgba(201,122,46,.35);--c-soft:var(--naranja-soft);--c-text:#e8b57f}
.chip.cian{--c-line:rgba(42,148,166,.35);--c-soft:var(--cian-soft);--c-text:#7fd4e2}

/* ═══ CTA principal ═══ */
.cta{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;gap:8px;
  height:clamp(38px,9.5dvh,48px);
  border-radius:12px;
  background:linear-gradient(135deg,var(--gold) 0%,#8f6d1c 100%);
  color:#161006;text-decoration:none;
  font-family:'Cinzel',serif;font-weight:700;
  font-size:clamp(.72rem,2.2dvh,.88rem);letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 18px rgba(201,162,39,.25);
  transition:transform .12s ease, box-shadow .12s ease;
}
.cta:active{transform:scale(.97);box-shadow:0 2px 10px rgba(201,162,39,.2)}
.cta svg{width:16px;height:16px}

/* ═══ FOOTER ═══ */
footer{
  flex:0 0 auto;text-align:center;line-height:1.5;
  font-size:clamp(.52rem,1.3dvh,.62rem);
  color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
}

@media (prefers-reduced-motion:reduce){.seal-orbit,.seal-glow{animation:none}}

/* Pantallas muy bajas: comprime aún más */
@media (max-height:600px){
  .card{gap:4px;padding:8px 16px}
  .seal-hint{display:none}
  .wave-row{height:16px}
}

/* Horizontal / landscape: dos columnas */
@media (max-height:420px) and (orientation:landscape){
  .card{flex-direction:row;flex-wrap:wrap;align-content:center;gap:8px}
  .seal-row,.id-row{flex:0 0 auto}
  .wave-row{display:none}
  .contact-row{order:5}
  .divider{display:none}
  .shortcuts{order:6;flex-basis:100%}
  .cta{order:7;flex-basis:100%}
  footer{order:8;flex-basis:100%}
}
</style>

<script>
// Retroalimentación táctil breve (ripple) en chips y CTA sin dependencias externas
document.querySelectorAll('.chip, .cta, .contact-btn').forEach(el=>{
  el.addEventListener('touchstart',()=>el.style.filter='brightness(1.15)',{passive:true});
  el.addEventListener('touchend',()=>setTimeout(()=>el.style.filter='',120),{passive:true});
});

// Onda animada — divisor sonoro dorado/cian
const wc = document.getElementById('wave-canvas');
const wctx = wc.getContext('2d');

function resizeWave(){
  const dpr = window.devicePixelRatio || 1;
  wc.width  = wc.offsetWidth  * dpr;
  wc.height = wc.offsetHeight * dpr;
  wctx.setTransform(dpr,0,0,dpr,0,0);
}
resizeWave();
window.addEventListener('resize', resizeWave);

function drawWave(t){
  const W = wc.offsetWidth, H = wc.offsetHeight;
  wctx.clearRect(0,0,W,H);
  const bars = 90;

  const g1 = wctx.createLinearGradient(0,0,W,0);
  g1.addColorStop(0,   'rgba(201,162,39,0)');
  g1.addColorStop(0.5, 'rgba(201,162,39,0.85)');
  g1.addColorStop(1,   'rgba(201,162,39,0)');
  wctx.beginPath(); wctx.strokeStyle = g1; wctx.lineWidth = 1.4;
  for(let i=0;i<=bars;i++){
    const x = (i/bars)*W;
    const y = H/2 + Math.sin(i*0.2 + t)*(H*0.24) + Math.sin(i*0.08 + t*0.7)*(H*0.12);
    i===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y);
  }
  wctx.stroke();

  const g2 = wctx.createLinearGradient(0,0,W,0);
  g2.addColorStop(0,   'rgba(42,148,166,0)');
  g2.addColorStop(0.5, 'rgba(42,148,166,0.4)');
  g2.addColorStop(1,   'rgba(42,148,166,0)');
  wctx.beginPath(); wctx.strokeStyle = g2; wctx.lineWidth = 1;
  for(let i=0;i<=bars;i++){
    const x = (i/bars)*W;
    const y = H/2 - Math.sin(i*0.2 + t)*(H*0.24) - Math.sin(i*0.08 + t*0.7)*(H*0.12);
    i===0 ? wctx.moveTo(x,y) : wctx.lineTo(x,y);
  }
  wctx.stroke();

  requestAnimationFrame(()=>drawWave(Date.now()*0.0018));
}

drawWave(Date.now()*0.0018);
</script>
